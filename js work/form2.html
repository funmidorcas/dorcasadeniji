<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-lg">

    <h1 class="text-center">Customer Review Form</h1>
    <form action="" id="review-form">
        <label for="name" class="block font-medium text-gray-700 mb-[5px]">Name:</label>
        <input type="text" id="name" name="name" required class="w-full p-2 border rounded-md focus:ring focus:ring-blue-300">
       <div>
        <label for="rating" class="block font-medium text-gray-700 mb-[5px]">Rating:</label>
        <select name="rating" id="rating" required class="w-full p-2 border rounded-md focus:ring focus:ring-blue-300">
            <option value="">Select a rating</option>
            <option value="">1-Poor</option>
            <option value="">2-Fair</option>
            <option value="">3-Good</option>
            <option value="">4-Very Good</option>
            <option value="">5-Excellent</option>
        </select>
        </div>
        <label for="comment">Comment:</label>
        <textarea name="text" id="comment" required placeholder="please leave a comment..." class="w-full mt-[5px] p-4 border rounded-md focus:ring focus:ring-blue-300"></textarea>
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600">Submit Review </button>

    </form>
    <div class="mt-[10px] ">
        <h1>Review: </h1>
    </div>

    </div>
    <script>
        
    </script>
</body>
</html>
